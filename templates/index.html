<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
 <meta charset="UTF-8">
<meta name="description" content="Muwesi AI - Your smart AI assistant for questions, writing, ideas and learning. Created by Muwesi Samuel.">
<meta name="author" content="Muwesi Samuel">
<meta name="creator" content="Muwesi Samuel">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://muwesi.vercel.app">
<meta property="og:title" content="Muwesi AI">
<meta property="og:description" content="Created by Muwesi Samuel - Your smart AI assistant.">
<meta property="og:url" content="https://muwesi.vercel.app">
<meta property="og:type" content="website">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muwesi AI</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#1e293b;padding:16px;text-align:center;font-weight:bold;font-size:19px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:18px;max-width:80%;line-height:1.4}
.user{background:#3b82f6;align-self:flex-end}
.bot{background:#1e293b;align-self:flex-start;border:1px solid #334155}
.input-area{display:flex;padding:14px;background:#1e293b;gap:10px}
input{flex:1;padding:13px;border-radius:25px;border:none;outline:none;font-size:16px}
button{background:#3b82f6;color:white;border:none;padding:12px 22px;border-radius:25px;font-weight:bold}
</style>
</head>
<body>
<div class="header">🤖 Muwesi AI - Chat with me!</div>
<div id="chat"><div class="msg bot">Hello! I'm Muwesi AI created by Muwesi Samuel. Ask me anything! 👋</div></div>
<div class="input-area">
<input id="inp" placeholder="Type message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
 let i=document.getElementById('inp');
 let t=i.value.trim();if(!t)return;
 let c=document.getElementById('chat');
 c.innerHTML+=`<div class="msg user">${t}</div>`;i.value='';c.scrollTop=c.scrollHeight;
 let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
 let d=await r.json();
 c.innerHTML+=`<div class="msg bot">${d.reply}</div>`;c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
